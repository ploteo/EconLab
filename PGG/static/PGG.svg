<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 703 635" role="img" aria-labelledby="title desc">
  <title id="title">Schema del gioco dei beni pubblici</title>
  <desc id="desc">Tre partecipanti ricevono una dotazione, contribuiscono al progetto comune e ricevono un ritorno dal progetto.</desc>
  <defs>
    <marker id="arrow-black" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#000" />
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#57bce9" />
    </marker>
    <marker id="arrow-yellow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#f7c62e" />
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#61c262" />
    </marker>
  </defs>

  <rect width="703" height="635" fill="#fff" />

  <circle cx="112" cy="112" r="75" fill="#57bce9" />
  <circle cx="506" cy="112" r="75" fill="#f7ce43" />
  <circle cx="315" cy="486" r="75" fill="#61c262" />

  <text x="112" y="115" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">E</text>
  <text x="506" y="115" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">E</text>
  <text x="315" y="489" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" dominant-baseline="middle">E</text>

  <text x="77" y="214" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#000">
    <tspan>E-</tspan><tspan fill="#57bce9">C</tspan><tspan>+R</tspan>
  </text>
  <text x="592" y="121" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#000">
    <tspan>E-</tspan><tspan fill="#f7c62e">C</tspan><tspan>+R</tspan>
  </text>
  <text x="277" y="589" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#000">
    <tspan>E-</tspan><tspan fill="#61c262">C</tspan><tspan>+R</tspan>
  </text>

  <rect x="255" y="192" width="127" height="126" fill="#fff" stroke="#000" stroke-width="1" />

  <text x="258" y="273" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#000">
    <tspan>(</tspan><tspan fill="#57bce9">C</tspan><tspan>+</tspan><tspan fill="#61c262">C</tspan><tspan>+</tspan><tspan fill="#f7c62e">C</tspan><tspan>)*2</tspan>
  </text>

  <line x1="174" y1="155" x2="304" y2="250" stroke="#57bce9" stroke-width="2" marker-end="url(#arrow-blue)" />
  <line x1="459" y1="169" x2="326" y2="248" stroke="#f7c62e" stroke-width="2" marker-end="url(#arrow-yellow)" />
  <line x1="312" y1="411" x2="312" y2="279" stroke="#61c262" stroke-width="2" marker-end="url(#arrow-green)" />

  <path d="M383,267 C457,267 491,241 504,186" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow-black)" />
  <text x="443" y="286" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#000">R</text>

  <path d="M254,294 C201,326 196,391 240,432" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow-black)" />
  <text x="193" y="366" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#000">R</text>

  <path d="M309,192 C284,139 236,117 187,114" fill="none" stroke="#000" stroke-width="2" marker-end="url(#arrow-black)" />
  <text x="277" y="141" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#000">R</text>

  <text x="222" y="193" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#57bce9">C</text>
  <text x="391" y="192" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f7c62e">C</text>
