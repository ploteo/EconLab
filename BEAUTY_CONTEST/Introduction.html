{{ load staticfiles otree }}

{{ block title }}

{{ endblock }}

{{ block content }}
<main class="intro-page">
    <section class="result-summary intro-hero-card" aria-label="{{ t.instructions_title }}">
        <!-- <div class="result-summary-heading">
            <p class="result-overline">Beauty Contest</p>
        </div> -->

        {{ include instructions_template }}

    </div>
</main>
{{ endblock }}

{{ block styles }}

{{ endblock }}
