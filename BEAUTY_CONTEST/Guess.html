{{ block title }}
<h1>{{ t.guess_title }}</h1>
{{ endblock }}

{{ block content }}
<input type="hidden" name="guess" id="guess">

<div class="card">
  <p>{{ t.guess_intro_1 }}</p>
  <p>{{ t.guess_intro_2 }}</p>

  <p>{{ t.guess_intro_3 }}</p>
  <br>
  <div class="row">
    <div class="w-100">
      <input type="number"
             min="0"
             max="{{ C.GUESS_MAX }}"
             step="1"
             id="guess-input"
             class="form-control"
             inputmode="numeric"
             placeholder="0-{{ C.GUESS_MAX }}"
             aria-label="{{ t.guess_aria }}">
    </div>
  </div>

  <br>

  <div id="panel">
    <p>{{ t.chosen_value }}
      <span class="badge rounded-pill my_badge" id="value_slider"></span></p>
  </div>


  <!-- Keep one visible submit button and one disabled placeholder for invalid input. -->
  <div class="row">
    <div class="col-md-10" style="font-size: 150%;font-weight: bold;">&NonBreakingSpace;
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary btn-large" id="bottoneconferma_disabled" disabled="true"> {{ t.confirm }} </button>
      <button class="btn btn-primary btn-large" id="bottoneconferma"> {{ t.confirm }} </button>
    </div>
  </div>

</div>

<br>
<button type="button" onclick="myFunction()" class="btn btn-info" id="instructions-button">
  {{ t.reread_instructions }}
</button><br>
<div id="myDIV" class="container box" style="font-size: 90%; display: none">
  {{ include instructions_template }}
</div>

{{ endblock }}


{{ block styles }}



<link rel="stylesheet" href="{% static 'global/styles.css' %}">

<style>
  input[type=number] {
    width: 100%;
    font-size: 1.1rem;
    padding: 0.6rem 0.75rem;
  }

  #value_slider.my_badge {
    background-color: #3c7570 !important;
    color: #fff !important;
    font-size: 100%;
  }

  #bottoneconferma,
  #bottoneconferma_disabled,
  #instructions-button {
    background-color: #3c7570 !important;
    border-color: #3c7570 !important;
    color: #fff !important;
  }

  #bottoneconferma:hover,
  #bottoneconferma:focus,
  #instructions-button:hover,
  #instructions-button:focus {
    background-color: #315f5b !important;
    border-color: #315f5b !important;
    color: #fff !important;
  }

  #bottoneconferma_disabled {
    opacity: 0.55;
  }
</style>

{{ endblock }}

{{ block scripts }}

<script>
  function myFunction() {
    // Show or hide the instruction text when the participant asks to reread it.
    var x = document.getElementById("myDIV");
    if (x.style.display === "block") {
      x.style.display = "none";
    } else {
      x.style.display = "block";
    }
  }
</script>

<script>
  $(document).ready(function () {
    // Hide confirmation controls until a valid number has been entered.
    $("#panel").hide();
    $("#bottoneconferma").hide();
  });
</script>

<script>
  $(function () {
    const $input = $("#guess-input");
    const $panel = $("#panel");
    const $badge = $("#value_slider");
    const $btn = $("#bottoneconferma");
    const $btnDisabled = $("#bottoneconferma_disabled");
    const $hidden = $("#guess");

    function update() {
      // Validate the browser input and copy it to the hidden oTree form field.
      const raw = $input.val();
      const num = Number(raw);
      const valid = raw !== "" && !Number.isNaN(num) && num >= 0 && num <= {{ C.GUESS_MAX }};

      if (valid) {
        // Enable submission only when the value is within the configured range.
        $badge.text(num);
        $hidden.val(num);
        $panel.show();
        $btn.show();
        $btnDisabled.hide();
      } else {
        $badge.text("");
        $hidden.val("");
        $panel.hide();
        $btn.hide();
        $btnDisabled.show();
      }
    }

    $input.on("input change", update);
  });
</script>




{{ endblock }}
