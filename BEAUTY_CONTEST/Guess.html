{{ load staticfiles otree }}

{{ block title }}
    <h1>{{ guess_title }}</h1>
{{ endblock }}

{{ block content }}
<main class="guess-page">
    <input type="hidden" name="guess" id="guess">

    <section class="result-summary guess-hero-card" aria-label="{{ guess_title }}">

        <div class="guess-prompt-wrap">
            <p class="guess-prompt">{{ t.guess_intro_1 }}</p>
            <p class="guess-prompt-hint">{{ t.guess_intro_2 }}</p>
        </div>

        <div class="guess-input-container">
            <label class="visually-hidden" for="guess-input">{{ t.guess_aria }}</label>
            <input type="number"
                   min="0"
                   max="{{ C.GUESS_MAX }}"
                   step="1"
                   id="guess-input"
                   class="guess-input"
                   inputmode="numeric"
                   placeholder="0 – {{ C.GUESS_MAX }}"
                   aria-label="{{ t.guess_aria }}"
                   autofocus>
        </div>

        <div id="panel" class="result-metric result-metric--yours guess-preview-metric" aria-live="polite">
            <span class="result-metric-label">{{ t.chosen_value }}</span>
            <strong id="value_slider"></strong>
        </div>

        <div class="guess-confirm-row result-actions">
            <button type="button" class="btn result-continue-button" id="bottoneconferma_disabled" disabled="true" aria-disabled="true">
                {{ t.confirm }} <span aria-hidden="true">→</span>
            </button>
            <button type="submit" class="btn result-continue-button" id="bottoneconferma">
                {{ t.confirm }} <span aria-hidden="true">→</span>
            </button>
        </div>
    </section>

    <section class="guess-instructions">
        <button type="button" onclick="myFunction()" class="instructions-toggle-btn" id="instructions-button" aria-expanded="false" aria-controls="myDIV">
            <span class="toggle-btn-left">
                <span class="toggle-btn-icon" aria-hidden="true">📖</span>
                <span>{{ t.reread_instructions }}</span>
            </span>
            <span class="toggle-chevron" aria-hidden="true">▼</span>
        </button>
        <div id="myDIV" class="result-card instructions-drawer" style="display: none">
            {{ include instructions_template }}
        </div>
    </section>
</main>
{{ endblock }}

{{ block styles }}
<link rel="stylesheet" href="{% static 'beauty_contest.css' %}">
{{ endblock }}

{{ block scripts }}
<script>
  function myFunction() {
    var x = document.getElementById("myDIV");
    var button = document.getElementById("instructions-button");
    var isExpanded = x.style.display === "block";
    x.style.display = isExpanded ? "none" : "block";
    button.setAttribute("aria-expanded", String(!isExpanded));
  }
</script>

<script>
  $(document).ready(function () {
    $("#panel").hide();
    $("#bottoneconferma").hide();
  });

  $(function () {
    const $input = $("#guess-input");
    const $panel = $("#panel");
    const $badge = $("#value_slider");
    const $btn = $("#bottoneconferma");
    const $btnDisabled = $("#bottoneconferma_disabled");
    const $hidden = $("#guess");

    function update() {
      const raw = $input.val().trim();
      const num = Number(raw);
      const valid = raw !== "" && !Number.isNaN(num) && num >= 0 && num <= {{ C.GUESS_MAX }};

      if (valid) {
        $badge.text(num);
        $hidden.val(num);
        $panel.show();
        $btn.show();
        $btnDisabled.hide();
      } else {
        $badge.text("");
        $hidden.val("");
        $panel.hide();
        $btn.hide();
        $btnDisabled.show();
      }
    }

    $input.on("input change keyup", update);
  });
</script>
{{ endblock }}
